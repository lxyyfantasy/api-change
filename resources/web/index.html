<!DOCTYPE html>
<html>

<head>
  <base href="/max/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Remote Desktop.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RustDesk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>RustDesk</title>
  <link rel="manifest" href="manifest.json">
  <script src="ogvjs-1.8.6/ogv.js"></script>
  <script src="yuv-canvas-1.2.6.js"></script>
  <style>
    .loading { display: flex; justify-content: center; align-items: center; margin: 0; position: absolute; top: 50%; left: 50%; -ms-transform: translate(-50%, -50%); transform: translate(-50%, -50%); }
    .loader { border: 16px solid #f3f3f3; border-radius: 50%; border: 15px solid; border-top: 16px solid #024eff; border-right: 16px solid white; border-bottom: 16px solid #024eff; border-left: 16px solid white; width: 120px; height: 120px; -webkit-animation: spin 2s linear infinite; animation: spin 2s linear infinite; }
    @-webkit-keyframes spin { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div class="loading">
    <div class="loader"></div>
  </div>
  <script>
    const serviceWorkerVersion = "2899420208";
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) return;
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
        navigator.serviceWorker.register(serviceWorkerUrl)
          .then((reg) => {
            function waitForActivation(serviceWorker) {
              serviceWorker.addEventListener('statechange', () => {
                if (serviceWorker.state == 'activated') loadMainDartJs();
              });
            }
            if (!reg.active && (reg.installing || reg.waiting)) waitForActivation(reg.installing || reg.waiting);
            else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) { reg.update(); waitForActivation(reg.installing); }
            else loadMainDartJs();
          });
        setTimeout(() => { if (!scriptLoaded) loadMainDartJs(); }, 4000);
      });
    } else {
      loadMainDartJs();
    }
  </script>
</body>
</html>
